[project]
name = "ootd-worker"
version = "0.1.0"
description = "Image processing worker: polls the Postgres job table, writes cutouts."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "pillow>=11",
    "numpy>=2.1",
    "scipy>=1.14",
]

[project.optional-dependencies]
# BiRefNet. Pulls ~3.5GB of weights from HuggingFace on the first cutout job:
# free, no token, no gate. A GPU is optional — CPU is slow but perfectly fine
# for a closet photographed one garment at a time.
local = [
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=4.46",
    "timm>=1.0",
    "kornia>=0.7",
    "einops>=0.8",
]
replicate = ["replicate>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worker*"]
